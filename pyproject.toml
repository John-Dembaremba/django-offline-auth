[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "django-offline-auth"
version = "0.1.0"
description = "Reusable offline authentication support for Django applications."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

authors = [
    { name = "John Dembaremba", email = "johndembaremba97@gmail.com" }
]

dependencies = [
    "Django>=5.2",
    "cryptography>=43.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-django>=4.13",
    "pytest-cov>=6.0",
    "ruff>=0.16",
]

[tool.ruff]
exclude = [
    "**/migrations/*.py",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [
    "src",
    ".",
]
testpaths = [
    "tests",
]

[tool.coverage.run]
source = [
    "django_offline_auth",
]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"